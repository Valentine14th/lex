{% extends 'base.html' %}
{% load bootstrap %}
{% block title %}Edit Twit{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;">
    <div class="card">
        <div class="card-body">
            <h4 class="card-title mb-3"><i class="bi bi-pencil me-2"></i>Edit Twit</h4>
            <form method="post" action="{% url 'edit_twit' form.instance.pk %}/">
                {% csrf_token %}
                {{ form|bootstrap }}
                <div class="text-end mt-3">
                    <a href="{% url 'my_twits' %}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
