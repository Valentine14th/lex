{% extends 'base.html' %}
{% load bootstrap %}
{% block title %}Send Data{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;">
    <h2 class="mb-2"><i class="bi bi-send me-2"></i>Send Data to Third Party</h2>
    <p class="text-body-secondary">Transmit personal data to a third-party entity.</p>
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|bootstrap }}
                <button type="submit" name="submit" value="true" class="btn btn-primary mt-2">
                    <i class="bi bi-send me-1"></i>Send Data
                </button>
            </form>
        </div>
    </div>
    <a href="{% url 'admin_dashboard' %}" class="btn btn-link mt-3 p-0"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
{% endblock %}
