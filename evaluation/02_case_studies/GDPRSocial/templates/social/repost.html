{% extends 'base.html' %}
{% load bootstrap %}
{% block title %}Repost{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;">
    <div class="card">
        <div class="card-body">
            <h4 class="card-title mb-3"><i class="bi bi-repeat me-2"></i>Repost</h4>
            <div class="card bg-body-tertiary mb-3">
                <div class="card-body">
                    <p class="mb-1">{{ twit.content }}</p>
                    <small class="text-body-secondary">
                        <i class="bi bi-person"></i> {{ twit.author }} &middot;
                        <i class="bi bi-clock"></i> {{ twit.posted_on }}
                    </small>
                </div>
            </div>
            <form method="post" action="{% url 'repost_twit' twit.pk %}">
                {% csrf_token %}
                {{ form|bootstrap }}
                <div class="text-end mt-3">
                    <a href="{% url 'twit_detail' twit.pk %}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-repeat me-1"></i>Repost
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
