{% extends 'base.html' %}
{% block title %}Delete My Data{% endblock %}
{% block content %}
<div class="container" style="max-width:500px;">
    <div class="card border-danger">
        <div class="card-body text-center py-4">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size:2.5rem;"></i>
            <h4 class="mt-3 mb-2">Delete All Your Data?</h4>
            <p class="text-body-secondary">This action cannot be undone. All your personal data, twits, and account information will be permanently removed.</p>
            <form method="post" action="{% url 'delete' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="d-flex gap-2 justify-content-center mt-3">
                    <button type="submit" name="decline" value="true" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i>No, take me back
                    </button>
                    <button type="submit" name="delete" value="true" class="btn btn-danger">
                        <i class="bi bi-trash me-1"></i>Yes, delete everything
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
