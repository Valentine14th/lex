{% extends 'base.html' %}
{% load bootstrap %}
{% block title %}Create Ad{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;">
    <div class="card">
        <div class="card-body">
            <h4 class="card-title mb-3"><i class="bi bi-megaphone me-2"></i>Create New Ad</h4>
            <form method="post" action="{% url 'ad_create' %}">
                {% csrf_token %}
                {{ form|bootstrap }}
                <div class="text-end mt-3">
                    <a href="{% url 'ad_list' %}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Create
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
